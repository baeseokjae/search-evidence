[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "search-evidence"
version = "0.1.0"
description = "Private search analytics, conservative URL protection, and publication evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "google-auth[requests]>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "mcp>=2.3,<3",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "requests>=2.32.4,<3",
]

[project.scripts]
search-evidence = "search_evidence.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/search_evidence"]
